spring.application.name=foundly-backend

# Local in-memory database; data is cleared when the application stops.
spring.datasource.url=jdbc:h2:mem:foundly;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
