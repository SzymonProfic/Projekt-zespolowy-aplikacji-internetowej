spring.application.name=foundly-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/foundly}
spring.datasource.username=${POSTGRES_USER:foundly}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8081/realms/foundly}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS:http://localhost:8081/realms/foundly/protocol/openid-connect/certs}
foundly.security.audience=foundly-backend
foundly.security.frontend-client=foundly-frontend
foundly.cors.origins=${CORS_ORIGINS:http://localhost:5173}

foundly.embedding.base-url=${EMBEDDING_BASE_URL:http://localhost:8000}
foundly.embedding.connect-timeout=${EMBEDDING_CONNECT_TIMEOUT:2s}
foundly.embedding.read-timeout=${EMBEDDING_READ_TIMEOUT:30s}
foundly.matching.lease-duration=${MATCHING_LEASE_DURATION:2m}
foundly.matching.enabled=${MATCHING_ENABLED:true}
foundly.matching.poll-interval=${MATCHING_POLL_INTERVAL:1s}
foundly.matching.retry-delay=${MATCHING_RETRY_DELAY:5s}
foundly.matching.max-attempts=${MATCHING_MAX_ATTEMPTS:5}

# Initial ranking policy; thresholds require calibration on labelled LOST/FOUND pairs.
foundly.matching.ranking.version=v1
foundly.matching.ranking.semantic-weight=0.6
foundly.matching.ranking.location-weight=0.2
foundly.matching.ranking.date-weight=0.1
foundly.matching.ranking.category-weight=0.1
foundly.matching.ranking.distance-scale-meters=10000
foundly.matching.ranking.date-scale-days=14
foundly.matching.ranking.early-found-tolerance-days=2
foundly.matching.ranking.early-found-scale-days=2
foundly.matching.ranking.min-semantic-score=0.5
foundly.matching.ranking.max-results=10

# Swagger signs in as the same public client as the frontend, with PKCE and no secret.
springdoc.swagger-ui.oauth.client-id=foundly-frontend
springdoc.swagger-ui.oauth.app-name=Foundly Swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid,profile,email
springdoc.swagger-ui.oauth2-redirect-url=${SWAGGER_REDIRECT_URL:http://localhost:8080/swagger-ui/oauth2-redirect.html}
