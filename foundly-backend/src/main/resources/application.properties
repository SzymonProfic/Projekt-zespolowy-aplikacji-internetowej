spring.application.name=foundly-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/foundly}
spring.datasource.username=${POSTGRES_USER:foundly}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8081/realms/foundly}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS:http://localhost:8081/realms/foundly/protocol/openid-connect/certs}
foundly.security.audience=foundly-backend
foundly.security.frontend-client=foundly-frontend
foundly.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Swagger signs in as the same public client as the frontend, with PKCE and no secret.
springdoc.swagger-ui.oauth.client-id=foundly-frontend
springdoc.swagger-ui.oauth.app-name=Foundly Swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid,profile,email
springdoc.swagger-ui.oauth2-redirect-url=${SWAGGER_REDIRECT_URL:http://localhost:8080/swagger-ui/oauth2-redirect.html}
