server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Brakujące zasoby Vite powinny zwracać 404 zamiast strony HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # Umożliwia otwieranie i odświeżanie tras React Routera.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
